<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomofarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one quiet centered column (pet, ring, timer, one button); farm and settings live in bottom sheets */
  --bg:#FAFAF9;
  --surface:#FAFAF9;
  --ink:#23221F;
  --muted:#8A8A88;
  --line:#E3E3E1;
  --accent:#23221F;
  --soft:#F0F0EE;
  --soft2:#EDEDEB;
  --veil:rgba(250,250,249,.75);
  --font-display:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.app{min-height:100%;max-width:420px;margin:0 auto;padding:18px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.icon:hover{background:var(--soft)}
.icon svg{width:22px;height:22px}
.badge{position:absolute;right:4px;top:4px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
.tabs{display:flex;gap:2px;background:var(--soft2);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.stage{position:relative;width:calc(100% + 40px);margin:56px -20px 0;aspect-ratio:340/120}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pet-hit{position:absolute;left:50%;width:26%;top:18%;bottom:0;transform:translateX(-50%);border:0;background:transparent;border-radius:40%}
.float{position:absolute;pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.float svg{width:14px;height:14px;display:block}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-60px) scale(1.1);opacity:0}}
.zzz{position:absolute;left:56%;top:22%;font-weight:700;color:var(--muted);pointer-events:none;display:none}
.stage.sleep .zzz{display:block}
.zzz span{position:absolute;animation:zz 2.6s ease-out infinite;opacity:0}
.zzz span:nth-child(2){animation-delay:.9s;font-size:19px}
.zzz span:nth-child(3){animation-delay:1.8s;font-size:23px}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(28px,-46px);opacity:0}}
.spark{position:absolute;left:50%;top:58%;width:5px;height:5px;border-radius:50%;background:var(--ink);pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

.who{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.who b{font-size:18px;font-weight:600}
.who small{color:var(--muted);font-size:13.5px}
.meta{display:flex;align-items:center;gap:12px}
.hearts{display:flex;gap:3px}
.hearts svg{width:13px;height:13px;display:block}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.time{font-weight:500;font-size:72px;line-height:1;margin-top:22px;display:flex}
.time .d{display:inline-block;width:.58em;text-align:center}
.time .c{width:.32em;transform:translateY(-.06em)}
.taskline{font-size:14px;color:var(--muted);min-height:20px;text-align:center}
.status{color:var(--muted);font-size:14.5px;text-align:center;min-height:42px;max-width:30ch;text-wrap:balance}
.actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;width:100%}
.btn{border:0;border-radius:999px;padding:15px 0;width:min(240px,100%);font-weight:600;font-size:17px;background:var(--ink);color:var(--bg);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.text-btn{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px}
.app.mini{padding:6px 12px 12px;max-width:none;min-height:100vh;justify-content:center;gap:2px}
.app.mini .stage{margin-top:0}
.app.mini .time{font-size:52px;margin-top:8px}
.app.mini .who{margin-top:0}
.mini-note{margin:60px auto;color:var(--muted);font-size:14px;text-align:center}
.text-btn.warn{color:var(--ink);text-decoration:underline}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:86%;overflow-y:auto;background:var(--surface);border:1.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px 28px;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:9;display:flex;flex-direction:column;gap:16px}
.sheet.on{transform:translate(-50%,0)}
.sheet{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;gap:14px}
.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:21px;font-weight:600;margin:0}
.group{display:flex;flex-direction:column;gap:8px}
.gl{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.species{flex:1 1 0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:6px 10px;font-size:14px;font-weight:600}
.species svg,.species canvas{width:40px;height:40px;flex:none}
.species[aria-pressed="true"]{border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.dur{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dur[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{width:100%;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;font-size:15px}
.field:disabled{color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.switch input{width:18px;height:18px;accent-color:var(--ink)}
.farm{position:relative;height:250px;border-radius:18px;overflow:hidden;border:1.5px solid var(--ink);background:linear-gradient(180deg,transparent 0 44%,var(--ink) 44% calc(44% + 1.5px),var(--soft) calc(44% + 1.5px) 100%)}
.farm .barn{position:absolute;left:4%;bottom:calc(56% - 2px);width:130px}
.farm .tree{position:absolute;right:7%;bottom:calc(56% - 2px);width:46px}
.farm .rails{position:absolute;left:40%;right:2%;bottom:calc(56% + 5px);height:9px;display:flex;flex-direction:column;justify-content:space-between}
.farm .rails i{display:block;height:1.8px;background:var(--ink);border-radius:1px}
.farm .posts{position:absolute;left:41%;right:2%;bottom:56%;height:22px;display:flex;justify-content:space-between}
.farm .posts i{width:3px;height:22px;border-radius:2px;background:var(--ink);display:block}
.fpet{position:absolute;width:58px;height:58px;transform:translateX(-50%);border:0;background:transparent;padding:0}
.fpet svg{width:100%;height:100%;display:block}
.farm{cursor:pointer}
.farm .trough{position:absolute;left:72%;bottom:12%;width:64px;transform:translateX(-50%);z-index:28;pointer-events:none}
.grain{position:absolute;width:5px;height:3.5px;border-radius:50%;background:#23221F;pointer-events:none;animation:gdrop .35s ease-out both}
.pf-pixel .grain{border-radius:0;width:4px;height:4px}
@keyframes gdrop{from{transform:translate(-50%,-34px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.farm-hint{margin:8px 2px 0;font-size:12.5px;color:var(--muted);text-align:center}
.fpet .sv{display:block;width:100%;height:100%}
@keyframes waddle{from{translate:0 0;rotate:-4deg}to{translate:0 -2px;rotate:4deg}}
@keyframes hop{50%{margin-bottom:14px}}
.farm-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;text-align:center;color:var(--muted);font-size:14px}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.roster span{font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.insight{font-size:14px;color:var(--muted);margin:0}
.insight b{color:var(--ink)}

/* overlay */
.overlay{position:fixed;inset:0;background:var(--veil);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:hidden}
.overlay.on{display:flex}
.dialog{background:var(--surface);border:1.5px solid var(--ink);border-radius:24px;padding:24px 22px 18px;max-width:330px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .35s ease-out;position:relative;z-index:2}
.dialog .art svg{width:120px;height:110px;display:block}
.dialog h3{font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.dialog p{margin:0;color:var(--muted);font-size:14.5px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.reasons button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.reasons button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
.confetti{position:absolute;top:-20px;width:8px;height:10px;border-radius:50%;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}


/* dark theme: UI tokens + the two-color art swapped through its literal fill/stroke values */
:root.pf-dark{--bg:#151514;--surface:#151514;--ink:#ECEAE4;--muted:#8F8D87;--line:#34332F;--accent:#ECEAE4;--soft:#22211F;--soft2:#262523;--veil:rgba(21,21,20,.78);color-scheme:dark}
.pf-dark feFlood:not(.fixed){flood-color:#ECEAE4}
.pf-dark svg [fill="#23221E"]{fill:#ECEAE4}
.pf-dark svg [stroke="#23221E"]{stroke:#ECEAE4}
.pf-dark .farm svg [fill="#23221E"]{fill:#23221E}
.pf-dark .farm svg [stroke="#23221E"]{stroke:#23221E}
.theme-row .dur{text-transform:none}
/* farm stays in daylight in both themes */
.pf-dark .farm{background:linear-gradient(180deg,#FAFAF9 0 44%,#23221F 44% calc(44% + 1.5px),#F0F0EE calc(44% + 1.5px) 100%);border-color:var(--line)}
.pf-dark .farm .rails i,.pf-dark .farm .posts i{background:#23221F}
.pf-dark .farm .farm-empty{color:#8A8A88}
.pf-dark .farm svg [fill="#23221F"]{fill:#23221F}
.pf-dark .farm svg [fill="#FAFAF9"]{fill:#FAFAF9}
.pf-dark .farm svg [fill="#D4D4D2"]{fill:#D4D4D2}
.pf-dark .farm svg [fill="#EAEAE8"]{fill:#EAEAE8}
.pf-dark .farm svg [fill="#D9D9D7"]{fill:#D9D9D7}
.pf-dark .farm svg [fill="#BDBDBB"]{fill:#BDBDBB}
.pf-dark .farm svg [fill="#4A4944"]{fill:#4A4944}
.pf-dark .farm svg [stroke="#23221F"]{stroke:#23221F}
.pf-dark .farm svg [stroke="#FAFAF9"]{stroke:#FAFAF9}
.pf-dark .farm svg [stroke="#77766F"]{stroke:#77766F}

/* pixel style */
.pf-pixel{--px:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
.pf-pixel body{-webkit-font-smoothing:none;font-smooth:never}
canvas.pxc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;display:none}
.pf-pixel canvas.pxc{display:block}
.pf-pixel .stage svg.scene{opacity:0}
.pf-pixel .fpet .sv svg{opacity:0}
.fpet .sv{position:relative}
canvas.pxs{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pf-pixel .farm .barn,.pf-pixel .farm .tree,.pf-pixel .farm .trough{filter:url(#pixS)}
.pf-pixel .btn,.pf-pixel .tabs,.pf-pixel .tabs button,.pf-pixel .dur,.pf-pixel .species,.pf-pixel .field,.pf-pixel .stat,.pf-pixel .roster span,.pf-pixel .reasons button,.pf-pixel .badge,.pf-pixel .icon{border-radius:0;clip-path:var(--px)}
.pf-pixel .dialog,.pf-pixel .farm{border-radius:0;border-width:3px;box-shadow:4px 4px 0 var(--ink)}
.pf-pixel .sheet{border-radius:0;border-width:3px}
.pf-pixel .grab{border-radius:0}
.pf-pixel .dots i{border-radius:0}
.pf-pixel .time{font-weight:500;font-size:76px;letter-spacing:0}
.pf-pixel .time .d{width:.62em}
.pf-pixel .farm .posts i,.pf-pixel .farm .rails i{border-radius:0}
.pf-pixel .confetti{border-radius:0}
.pf-pixel .spark{border-radius:0}
@media (prefers-reduced-motion:reduce){
  .spark,.confetti,.float,.zzz span}
  .sheet,.scrim{transition:none}
  .dialog{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="pixL" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feFlood x="2" y="2" width="1" height="1"/><feComposite width="5" height="5"/><feTile result="g"/><feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="2"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer></filter><filter id="pixS" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feFlood x="1" y="1" width="1" height="1"/><feComposite width="3" height="3"/><feTile result="g"/><feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="1"/><feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer></filter></defs></svg>
<div class="app">
  <div class="bar">
    <button type="button" class="icon" id="openFarm" aria-label="My farm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 10.5L12 4l9 6.5V20H3z"/><path d="M9.5 20v-5.5h5V20"/></svg><span class="badge" id="farmBadge"></span></button>
    <div class="tabs" role="group" aria-label="Mode">
      <button type="button" data-mode="focus" aria-pressed="true">Focus</button>
      <button type="button" data-mode="short" aria-pressed="false">Break</button>
    </div>
    <button type="button" class="icon" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>

  <div class="stage" id="stage">
    <svg class="scene" viewBox="30 70 340 120" aria-hidden="true">
      <defs>
        <clipPath id="clipTop"><polygon points="60,70 140,70 140,128 131,128 124,129 118,124 112,129 106,123 100,128 95,123 89,129 84,123 78,128 69,128 60,128"/></clipPath>
        <clipPath id="clipBot"><polygon points="60,128 69,128 78,128 84,123 89,129 95,123 100,128 106,123 112,129 118,124 124,129 131,128 140,128 140,180 60,180"/></clipPath>
      </defs>
      <g id="pet"></g>
      <filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/><feFlood flood-color="#23221F"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="outlineFixed" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/><feFlood class="fixed" flood-color="#23221F"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </svg>
    <canvas class="pxc" id="pxStage" width="85" height="30" aria-hidden="true"></canvas>
    <button type="button" class="pet-hit" id="petHit" aria-label="Pet your pet"></button>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
  </div>

  <div class="who">
    <b id="chip">Peep</b>
    <div class="meta">
      <span class="dots" id="cycleDots" aria-label="Growth"></span>
    </div>
  </div>

  <div class="time" id="time">25:00</div>
  <div class="taskline" id="taskline"></div>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="actions">
    <button type="button" class="btn" id="btnMain">Start</button>
    <button type="button" class="text-btn" id="btnSec" hidden>Give up</button>
    <button type="button" class="text-btn" id="btnMini" hidden>Mini window</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="farmSheet" aria-labelledby="farmTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="farmTitle">My farm</h2><button type="button" class="text-btn" data-close>Done</button></div>
  <div class="farm" id="farm"><div class="rails"><i></i><i></i></div><div class="posts"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><svg class="barn" viewBox="0 0 140 98" aria-hidden="true"><g stroke="#23221F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<path d="M108 96V40Q120 24 132 40V96Z" fill="#FAFAF9"/><path d="M108 56H132M108 72H132M108 88H132" fill="none" stroke-width="1.4" opacity=".55"/>
<path d="M10 46L55 15L100 46V96H10Z" fill="#FAFAF9"/>
<path d="M4 48L55 9L106 48" fill="none" stroke-width="6"/>
<rect x="46" y="31" width="18" height="12" rx="1.5" fill="#EAEAE8"/>
<rect x="35" y="58" width="40" height="38" fill="#EAEAE8"/><path d="M35 58L75 96M75 58L35 96M55 58V96" fill="none" stroke-width="1.6"/>
<rect x="16" y="60" width="12" height="12" fill="#EAEAE8"/><rect x="82" y="60" width="12" height="12" fill="#EAEAE8"/>
</g></svg><svg class="tree" viewBox="0 0 60 90" aria-hidden="true"><g stroke="#23221F" stroke-width="2.2" stroke-linejoin="round"><path d="M30 88V52" stroke-linecap="round"/><path d="M30 64L22 56M30 60L38 52" stroke-width="1.6" stroke-linecap="round"/><path d="M30 6C46 6 54 18 52 30C58 38 52 52 40 52H20C8 52 2 38 8 30C6 18 14 6 30 6Z" fill="#EAEAE8"/></g></svg><svg class="trough" viewBox="0 0 64 34" aria-hidden="true"><g stroke="#23221F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 24v7M52 24v7" fill="none"/><path d="M5 9H59L53 28H11Z" fill="#FAFAF9"/><path d="M5 9Q32 15 59 9Q32 3 5 9Z" fill="#D4D4D2"/><path d="M20 10q4 2 8 0M36 9q4 2 8 0" fill="none" stroke-width="1.4"/></g></svg><div id="farmPets"></div></div>
  <div class="roster" id="roster"></div>
  <div class="stats">
    <div class="stat"><b id="sMins">0</b><small>focus min today</small></div>
    <div class="stat"><b id="sSess">0</b><small>sessions today</small></div>
    <div class="stat"><b id="sRaised">0</b><small>pets raised</small></div>
  </div>
  <p class="insight" id="insight"></p>
</section>

<section class="sheet" id="setSheet" aria-labelledby="setTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="setTitle">Settings</h2><button type="button" class="text-btn" data-close>Done</button></div>
  <div class="group">
    <span class="gl">Egg</span>
    <div class="row" id="speciesRow"></div>
    <p class="note" id="speciesNote"></p>
  </div>
  <div class="group"><span class="gl">Focus length (min)</span><div class="row" id="dursFocus"></div></div>
  <div class="group"><span class="gl">Break length (min)</span><div class="row" id="dursShort"></div></div>
  <div class="group"><span class="gl">Sessions to grow up</span><div class="row" id="roundsRow"></div><p class="note" id="roundsNote"></p></div>
  <div class="group"><label class="gl" for="petName">Pet name</label><input class="field" id="petName" maxlength="16" autocomplete="off"></div>
  <div class="group"><label class="gl" for="task">Focusing on (optional)</label><input class="field" id="task" maxlength="60" placeholder="e.g. Review the GL module" autocomplete="off"></div>
  <div class="group"><span class="gl">Theme</span><div class="row theme-row" id="themeRow"><button type="button" class="dur" data-theme-pick="auto">Auto</button><button type="button" class="dur" data-theme-pick="light">Light</button><button type="button" class="dur" data-theme-pick="dark">Dark</button></div></div>
  <div class="group"><span class="gl">Style</span><div class="row" id="styleRow"><button type="button" class="dur" data-style-pick="smooth">Smooth</button><button type="button" class="dur" data-style-pick="pixel">Pixel</button></div></div>
  <label class="switch" for="fast">Quick preview (1 min = 1 sec)<input type="checkbox" id="fast"></label>
  <button type="button" class="text-btn" id="clear" style="align-self:flex-start;padding-left:0">Reset everything</button>
</section>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <div class="art" id="ovArt"></div>
    <h3 id="ovTitle"></h3>
    <p id="ovText"></p>
    <div class="reasons" id="reasons" hidden></div>
    <button type="button" class="btn" id="ovMain"></button>
    <button type="button" class="text-btn" id="ovSec"></button>
  </div>
</div>

<script>
(function(){
"use strict";
const GROUND=172;
let pipWin=null;
const $=s=>document.querySelector(s)||(pipWin&&!pipWin.closed?pipWin.document.querySelector(s):null);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const f=n=>(+n).toFixed(1);
const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LINE="#23221E";const PAPER="#FAFAF9",INK="#23221F",TINT="#D4D4D2",TINT2="#EAEAE8";
const VARIANTS={
  white:{label:"Plain",body:PAPER,wing:TINT2,tail:TINT,w:35},
  grey:{label:"Misty",body:"#D9D9D7",wing:"#BDBDBB",tail:"#BDBDBB",w:22},
  speckled:{label:"Plain",body:PAPER,wing:TINT2,tail:TINT,w:0},
  masked:{label:"Masked",body:PAPER,head:INK,wing:TINT2,tail:INK,w:12},
  black:{label:"Shadow",body:INK,wing:"#4A4944",tail:"#4A4944",dark:true,w:9}
};
function randomVariant(){const tot=Object.values(VARIANTS).reduce((a,v)=>a+v.w,0);let r=Math.random()*tot;for(const k in VARIANTS){r-=VARIANTS[k].w;if(r<=0)return k;}return "white";}
const SPECIES={
  chick:{name:"Chicken",def:"Peep",stages:["Egg","Chick","Young","Teen","Hen"],baby:PAPER,babyS:TINT,adult:PAPER,adultS:TINT,beak:INK,leg:LINE,egg:PAPER,eggSpot:TINT,confetti:["var(--ink)","var(--muted)"]},
  duck:{name:"Duck",def:"Puddle",stages:["Egg","Duckling","Young","Teen","Duck"],baby:PAPER,babyS:TINT,adult:PAPER,adultS:TINT,beak:INK,leg:LINE,egg:PAPER,eggSpot:TINT,confetti:["var(--ink)","var(--muted)"]}
};

/* ---------- drawing ---------- */
function eggPath(top,bot){return `M100 ${top}C118 ${top} 131 ${top+34} 131 ${top+50}C131 ${bot-8} 117 ${bot} 100 ${bot}C83 ${bot} 69 ${bot-8} 69 ${top+50}C69 ${top+34} 82 ${top} 100 ${top}Z`;}
const EGG_TOP=GROUND-84,EGG_BOT=GROUND-8;
function eggBody(sp){
  let o=`<path d="${eggPath(EGG_TOP,EGG_BOT)}" fill="${sp.egg}" stroke="${LINE}" stroke-width="2.4"/><path d="M84 ${EGG_TOP+20}q-6 10 -7 22" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".35"/>`;
  [[110,104,2.4],[88,140,1.8],[118,146,2.2],[96,116,1.5],[112,126,1.4]].forEach(([x,y,r])=>o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${sp.eggSpot}"/>`);
  return o;
}
function nestBack(){return `<ellipse cx="100" cy="${GROUND-7}" rx="47" ry="12" fill="${TINT}" stroke="${LINE}" stroke-width="2.4"/>`;}
function nestFront(){
  let o=`<path d="M53 ${GROUND-9}Q100 ${GROUND+16} 147 ${GROUND-9}Q141 ${GROUND+7} 100 ${GROUND+9}Q59 ${GROUND+7} 53 ${GROUND-9}Z" fill="${PAPER}" stroke="${LINE}" stroke-width="2.4" stroke-linejoin="round"/>`;
  o+=`<path d="M60 ${GROUND-4}q20 8 40 7M78 ${GROUND+2}q22 2 44 -5M104 ${GROUND-1}q20 -1 38 -7M66 ${GROUND-8}q10 6 22 6" stroke="${INK}" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".55"/>`;
  return o;
}
function drawEgg(type,p,o){
  const sp=SPECIES[type],t=o.t||0;
  const period=Math.max(1.2,3.4-2*p),ph=t%period,env=ph<.7?Math.sin(ph/.7*Math.PI):0;
  const amp=(o.running?(3+9*p):1.2)*env+(o.tapWob||0);
  const rot=Math.sin(t*22)*amp;
  const y=128;
  const cracks=[[`M74 ${y}l6 -5 5 6 6 -6 5 5`,seg(p,.3,.55)],[`M96 ${y}l5 -5 6 6 6 -5 6 5 6 -1`,seg(p,.5,.78)],[`M89 ${y+1}l-2 9 4 5M112 ${y}l3 -10 -4 -6`,seg(p,.75,.97)]];
  let c="";
  cracks.forEach(([d,k])=>{if(k>0)c+=`<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1-k).toFixed(3)}" stroke="${INK}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;});
  return `<ellipse cx="100" cy="${GROUND+3}" rx="44" ry="5" fill="${LINE}" opacity=".1"/>`+nestBack()+`<g transform="rotate(${f(rot)} 100 ${EGG_BOT})">${eggBody(sp)}${c}</g>`+nestFront();
}

function drawPet(type,G,o){
  o=o||{};
  const sp=SPECIES[type],duck=type==="duck";
  const grow=clamp((G-1)/3);
  const V=VARIANTS[o.variant]||VARIANTS.white;
  const col=V.body,darkFace=!!(V.dark||V.head);
  const faceInk=darkFace?PAPER:INK;
  const rx=lerp(24,32,grow)*(duck?1.08:1),ry=lerp(23,30,grow);
  const leg=lerp(8,11,grow),sc=lerp(.75,1,grow);
  const breathe=Math.sin((o.t||0)*2.2)*(o.sleep?1.4:.7);
  const hop=o.hop||0;
  const ph=(o.t||0)*9,walkBob=o.walk?Math.abs(Math.sin(ph))*2.2*sc:0;
  const bx=100,by=GROUND-ry-leg-hop+breathe*.4-walkBob;
  let out=`<ellipse cx="${bx}" cy="${GROUND+2}" rx="${f(rx*.9*(1-hop/70))}" ry="${f(3+3*sc)}" fill="${LINE}" opacity=".1"/>`;
  if(o.seeds){[[58,2],[66,5],[72,1],[136,3],[144,6],[128,6],[150,1],[62,7]].forEach(([x,dy],i)=>{if(o.seedsLeft>i)out+=`<ellipse cx="${x}" cy="${GROUND+dy-2}" rx="2" ry="1.3" fill="${INK}" transform="rotate(${i*40} ${x} ${GROUND+dy-2})"/>`;});}
  let legs="";
  [bx-rx*.28,bx+rx*.28].forEach((x0,i)=>{
    const q=ph+i*Math.PI;
    const lift=o.walk?Math.max(0,Math.sin(q))*6*sc:0;
    const hipX=x0,x=x0-(o.walk?Math.cos(q)*8*sc:0);
    legs+=`<path d="M${f(hipX)} ${f(by+ry*.8)}L${f(x)} ${f(GROUND-lift)}" stroke="${sp.leg}" stroke-width="${f(2.4+.8*sc)}" stroke-linecap="round"/>`;
    if(duck) legs+=`<ellipse cx="${f(x+2.5*sc)}" cy="${f(GROUND-1-lift)}" rx="${f(6.5*sc)}" ry="${f(2.2*sc)}" fill="${sp.leg}"/>`;
    else legs+=`<path d="M${f(x-3.5*sc)} ${f(GROUND-lift)}h${f(8*sc)}" stroke="${sp.leg}" stroke-width="2.4" stroke-linecap="round"/>`;
  });
  out+=legs+`<g filter="url(#${o.fixedInk?"outlineFixed":"outline"})">`;
  const pk=o.peck||0;
  out+=`<g transform="translate(0 ${f(pk*6)}) rotate(${f(pk*15)} ${bx} ${GROUND})">`;
  // side wings
  const fl=o.flap||0,wc=V.dark?"#77766F":LINE;
  [-1,1].forEach(d=>{
    const sx=bx+d*(rx-1),sy=by-ry*.06;
    out+=`<path d="M${f(sx)} ${f(sy)}q${f(d*rx*.3)} ${f(ry*.28)} ${f(-d*rx*.04)} ${f(ry*.58)}" stroke="${wc}" stroke-width="2.6" fill="none" stroke-linecap="round" transform="rotate(${f(d*fl*50)} ${f(sx)} ${f(sy)})"/>`;
  });
  // tuft
  const tu=1-seg(grow,.5,1)*.25;
  if(duck) out+=`<path d="M${f(bx)} ${f(by-ry+1)}q${f(-3)} ${f(-8)} ${f(5)} ${f(-11)}" stroke="${LINE}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  else out+=`<path d="M${f(bx-5)} ${f(by-ry+1)}q${f(-2)} ${f(-8)} ${f(-6)} ${f(-9)}M${f(bx)} ${f(by-ry)}q0 ${f(-9*tu)} 0 ${f(-11*tu)}M${f(bx+5)} ${f(by-ry+1)}q${f(2)} ${f(-8)} ${f(6)} ${f(-9)}" stroke="${LINE}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  // body
  out+=`<ellipse cx="${bx}" cy="${f(by)}" rx="${f(rx)}" ry="${f(ry)}" fill="${col}" stroke="${LINE}" stroke-width="1.6"/>`;
  if(V.head){const cy=by+ry*.12,w=rx*Math.sqrt(1-.0144*0);out+=`<path d="M${f(bx-rx*.99)} ${f(cy)}A${f(rx)} ${f(ry)} 0 0 1 ${f(bx+rx*.99)} ${f(cy)}Z" fill="${V.head}"/>`;}
  // cheeks
  const ck=darkFace&&V.dark?"#4A4944":TINT;
  if(!V.head)[-1,1].forEach(d=>out+=`<ellipse cx="${f(bx+d*rx*.5)}" cy="${f(by+ry*.2)}" rx="${f(rx*.16)}" ry="${f(ry*.1)}" fill="${ck}"/>`);
  // face
  const ey=by-ry*(duck?.22:.12),er=Math.max(2.4,rx*.1),eyes=[bx-rx*.31,bx+rx*.31];
  eyes.forEach((x,i)=>{
    if(o.sleep||o.happy) out+=`<path d="M${f(x-er)} ${f(ey)}q${f(er)} ${o.happy?f(-er*1.3):f(er*1.1)} ${f(2*er)} 0" stroke="${faceInk}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
    else{
      const b=o.blink||0;
      if(darkFace&&b<.5) out+=`<circle cx="${f(x)}" cy="${f(ey)}" r="${f(er*1.75)}" fill="${PAPER}"/>`;
      out+=`<ellipse cx="${f(x)}" cy="${f(ey)}" rx="${f(er)}" ry="${f(Math.max(.3,er*(1-b*.92)))}" fill="${INK}"/>`;
    }
    if(o.sad>0){
      const d=i===0?1:-1;
      out+=`<path d="M${f(x-er*1.4*d)} ${f(ey-er*1.6)}L${f(x+er*1.2*d)} ${f(ey-er*2.4)}" stroke="${faceInk}" stroke-width="1.5" stroke-linecap="round" opacity="${o.sad.toFixed(2)}"/>`;
    }
  });
  if(o.sad>0){const x=eyes[1];out+=`<path d="M${f(x)} ${f(ey+er*1.3)}q${f(-er)} ${f(er*1.7)} 0 ${f(er*2.3)}q${f(er)} ${f(-er*.6)} 0 ${f(-er*2.3)}z" fill="${PAPER}" stroke="${INK}" stroke-width="1.1" opacity="${o.sad.toFixed(2)}"/>`;}
  const bk=darkFace?TINT:sp.beak;
  if(duck) out+=`<ellipse cx="${bx}" cy="${f(by+ry*.14)}" rx="${f(rx*.4)}" ry="${f(ry*.19)}" fill="${darkFace?TINT:TINT}" stroke="${LINE}" stroke-width="1.6"/>`;
  else out+=`<path d="M${f(bx-rx*.15)} ${f(by+ry*.08)}L${f(bx+rx*.15)} ${f(by+ry*.08)}L${f(bx)} ${f(by+ry*.28)}Z" fill="${bk}" stroke="${bk}" stroke-width="1.2" stroke-linejoin="round"/>`;
  out+=`</g></g>`;
  return out;
}
function drawHatch(type,h,t,variant){
  const sp=SPECIES[type];
  const baby=drawPet(type,1,{t,happy:h>.5,variant});
  const sc=easeBack(seg(h,.12,.6));
  let o=nestBack();
  o+=`<g transform="translate(${f(-34*h)} ${f(-46*h+70*h*h)}) rotate(${f(-80*h)} 100 128)" opacity="${(1-seg(h,.55,1)).toFixed(2)}"><g clip-path="url(#clipTop)">${eggBody(sp)}</g></g>`;
  o+=`<g transform="translate(100 ${GROUND}) scale(${sc.toFixed(3)}) translate(-100 ${-GROUND})">${baby}</g>`;
  o+=`<g opacity="${(1-seg(h,.6,1)).toFixed(2)}" clip-path="url(#clipBot)">${eggBody(sp)}</g>`;
  return o+nestFront();
}
function petSVG(type,G,o,vb){
  if(!vb) vb=G<1?"40 64 120 116":G<2.5?"58 96 84 80":"40 64 120 116";
  return `<svg viewBox="${vb}" aria-hidden="true">${G<1?drawEgg(type,G,o||{}):drawPet(type,G,o||{})}</svg>`;
}

/* ---------- state ---------- */
const KEY="focusPets.v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({pet:S.pet,farm:S.farm,log:S.log,reasons:S.reasons,mins:S.mins,lost:S.lost,rounds:S.rounds,theme:S.theme,worms:S.worms,style:S.style}));}catch(e){}}
const saved=load();
function newPet(type){return {type,name:SPECIES[type].def,sessions:0,variant:randomVariant()};}
const S={
  mode:"focus",status:"idle",fast:false,duration:0,endAt:0,remaining:0,
  pet:saved.pet&&SPECIES[saved.pet.type]?Object.assign({variant:randomVariant()},saved.pet):newPet("chick"),
  farm:Array.isArray(saved.farm)?saved.farm.filter(p=>SPECIES[p.type]):[],
  log:Array.isArray(saved.log)?saved.log:[],
  reasons:saved.reasons||{},
  mins:Object.assign({focus:25,short:5,long:15},saved.mins||{}),
  lost:saved.lost||0,
  override:null,hatchAt:0,sadUntil:0,nextBreak:"short",
  rounds:[1,2,3,4,6,8].includes(saved.rounds)?saved.rounds:4,
  theme:["auto","light","dark"].includes(saved.theme)?saved.theme:"auto",
  style:saved.style==="pixel"?"pixel":"smooth",
  worms:saved.worms&&saved.worms.day?saved.worms:{day:"",n:0,total:0}
};
const MODES={focus:{opts:[15,25,45,60]},short:{opts:[3,5,10]},long:{opts:[15,20,30]}};
const speed=()=>S.fast?60:1;
const durMs=()=>S.mins[S.mode]*60000/speed();

/* ---------- audio ---------- */
let ac=null;
function ensureAudio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}if(ac&&ac.state==="suspended")ac.resume();}catch(e){ac=null;}}
function tone(fr,at,len,vol,type,slide){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";
  o.frequency.setValueAtTime(fr,at);if(slide)o.frequency.exponentialRampToValueAtTime(slide,at+len);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+len);
  o.connect(g).connect(ac.destination);o.start(at);o.stop(at+len+.05);
}
function chime(){if(!ac)return;try{const n=ac.currentTime;[659.3,880,1046.5].forEach((fr,i)=>tone(fr,n+i*.18,1.3,.16));}catch(e){}}
function cheep(){if(!ac)return;try{const n=ac.currentTime;const d=S.pet.type==="duck";if(d){tone(520,n,.12,.12,"sawtooth",380);tone(520,n+.16,.12,.1,"sawtooth",380);}else{tone(2100,n,.08,.08,"sine",2900);tone(2300,n+.12,.08,.07,"sine",3100);}}catch(e){}}

/* ---------- elements ---------- */
const stage=$("#stage"),petG=$("#pet"),timeEl=$("#time"),statusEl=$("#status"),chip=$("#chip"),taskEl=$("#task"),nameEl=$("#petName"),taskline=$("#taskline");
const btnMain=$("#btnMain"),btnSec=$("#btnSec"),overlay=$("#overlay"),fastEl=$("#fast");
/* sheets */
const scrim=$("#scrim");
function openSheet(id){closeSheets();const sh=$(id);sh.classList.add("on");sh.setAttribute("aria-hidden","false");scrim.classList.add("on");if(id==="#farmSheet")renderSide();setTimeout(()=>sh.querySelector("[data-close]").focus(),60);}
function closeSheets(){document.querySelectorAll(".sheet").forEach(s=>{s.classList.remove("on");s.setAttribute("aria-hidden","true");});scrim.classList.remove("on");}
$("#openFarm").addEventListener("click",()=>openSheet("#farmSheet"));
$("#openSettings").addEventListener("click",()=>openSheet("#setSheet"));
scrim.addEventListener("click",closeSheets);
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheets));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheets();});
const HEART=(on)=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14S1.5 9.8 1.5 5.6A3.3 3.3 0 0 1 8 4.2a3.3 3.3 0 0 1 6.5 1.4C14.5 9.8 8 14 8 14Z" fill="${on?"#23221E":"none"}" stroke="#23221E" stroke-width="1.5"/></svg>`;

function floatAt(html,x,y,n){
  if(reduced) return;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");s.className="float";s.innerHTML=html;
    s.style.left=x+"%";s.style.top=y+"%";s.style.setProperty("--dx",(Math.random()*50-25)+"px");s.style.animationDelay=(i*.12)+"s";
    stage.appendChild(s);setTimeout(()=>s.remove(),1400+i*120);
  }
}
function burst(n){
  if(reduced) return;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");s.className="spark";
    const an=Math.random()*Math.PI*2,d=40+Math.random()*70;
    s.style.setProperty("--dx",Math.cos(an)*d+"px");s.style.setProperty("--dy",Math.sin(an)*d+"px");
    s.style.background=i%2?"var(--ink)":"var(--muted)";
    stage.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}

/* ---------- builders ---------- */
function buildSpecies(){
  const row=$("#speciesRow");row.innerHTML="";
  Object.keys(SPECIES).forEach(k=>{
    const b=document.createElement("button");b.type="button";b.className="species";b.dataset.type=k;
    b.innerHTML=petSVG(k,4,{},"52 56 96 120")+`<span>${SPECIES[k].name}</span>`;
    b.addEventListener("click",()=>{
      if(S.status!=="idle"||S.pet.sessions>0) return;
      const wasDefault=S.pet.name===SPECIES[S.pet.type].def;
      S.pet.type=k;if(wasDefault)S.pet.name=SPECIES[k].def;
      nameEl.value=S.pet.name;save();updateUI();
    });
    row.appendChild(b);
  });
}
function buildRounds(){
  const box=$("#roundsRow");if(box.childElementCount)return;
  [1,2,3,4,6,8].forEach(n=>{
    const b=document.createElement("button");b.type="button";b.className="dur";b.textContent=n;b.setAttribute("aria-label",n+" sessions");
    b.addEventListener("click",()=>{if(S.status==="running"||S.status==="paused"||n<=S.pet.sessions)return;S.rounds=n;save();updateUI();});
    box.appendChild(b);
  });
}
function buildDurs(){
  buildRounds();
  ["focus","short"].forEach(md=>{
    const box=$(md==="focus"?"#dursFocus":"#dursShort");if(box.childElementCount)return;
    MODES[md].opts.forEach(m=>{
      const b=document.createElement("button");b.type="button";b.className="dur";b.textContent=m;b.dataset.m=md;b.setAttribute("aria-label",m+" minutes");
      b.addEventListener("click",()=>{if(S.status==="running"||S.status==="paused")return;S.mins[md]=m;if(md==="short")S.mins.long=Math.max(15,m*3);save();if(S.status==="idle")reset();else updateUI();});
      box.appendChild(b);
    });
  });
}

/* ---------- actions ---------- */
function setMode(m){S.mode=m;if(m==="focus")S.override=null;buildDurs();reset();}
function reset(){S.status="idle";S.remaining=durMs();S.duration=durMs();hideOverlay();updateUI();}
function start(){if(S.mode==="focus")S.override=null;worm.phase="none";worm.next=clock+5+Math.random()*7;S.duration=durMs();S.remaining=S.duration;S.endAt=Date.now()+S.duration;S.status="running";updateUI();}
function pause(){S.remaining=Math.max(0,S.endAt-Date.now());S.status="paused";updateUI();}
function resume(){S.endAt=Date.now()+S.remaining;S.status="running";updateUI();}
let confirmTimer=null;
function giveUp(){
  if(!btnSec.classList.contains("warn")){
    btnSec.classList.add("warn");btnSec.textContent=curG()<1?"Sure? The egg will go cold":`Sure? ${S.pet.name} will leave`;
    clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{btnSec.classList.remove("warn");updateUI();},3000);
    return;
  }
  clearTimeout(confirmTimer);btnSec.classList.remove("warn");
  const gNow=curG();
  S.status="failed";S.sadUntil=0;
  const gone=Object.assign({},S.pet);
  S.lost++;S.pet=newPet(gone.type);nameEl.value=S.pet.name;
  save();updateUI();showReflect(gone,gNow);
}
function complete(){
  if(S.status!=="running") return;
  S.status="done";S.remaining=0;chime();
  if(S.mode==="focus"){
    const p=S.pet;
    p.sessions++;p.hearts=Math.min(3,p.hearts+1);

function updateFarm(dt){

  let wormSvg="";
  if(!(S.hatchAt&&hatchK<1)&&G>=1){
    let wormPeck=0,wormHold=false,wormHappy=false;
    const canHunt=focus&&st==="running"&&!reduced&&!S.override;
    if(!canHunt&&worm.phase!=="gulp")worm.phase="none";
    if(canHunt&&worm.phase==="none"&&clock>worm.next){worm.phase="approach";worm.x=360;worm.t=clock;}
    const sz=.55+.45*clamp((G-1)/3),reach=200+26*sz+8;
    if(worm.phase==="approach"){
      worm.x-=dt*30;
      if(worm.x<=reach){worm.x=reach;worm.phase="peck";worm.t=clock;}
      wormSvg=drawWorm(worm.x,clock,clamp((clock-worm.t)/.6));
    }else if(worm.phase==="peck"){
      const k=(clock-worm.t)/.55;wormHold=true;
      if(k>=1){worm.phase="gulp";worm.t=clock;cheep();floatAt(HEART(true),petPct+4,30,2);countWorm();}
      else{wormPeck=Math.sin(k*Math.PI);if(k<.5)wormSvg=drawWorm(worm.x,clock,1);}
    }else if(worm.phase==="gulp"){
      wormHold=true;wormHappy=true;
      if(clock-worm.t>1.4){worm.phase="none";worm.next=clock+12+Math.random()*20;}
    }
    const walking=moveStep(dt,G,sleeping||sad>0.05||peck>0||hop>0||wormHold,breakMode);
    svg=drawPet(p.type,G,{variant:p.variant,t:clock,blink,peck:Math.max(peck,wormPeck),hop,flap,sleep:sleeping,sad,seeds:false,happy:hop>4||wormHappy,walk:walking});
  }
  const mx=mover.x-100;
  const dir=G<1||(S.hatchAt&&hatchK<1)?1:mover.dir;
  petG.innerHTML=(breakMode&&G>=1?seedsWorld():"")+`<g transform="translate(${f(mx+100)} 0) scale(${dir} 1) translate(-100 0)">${svg}</g>`+wormSvg;
  if(isPixel()&&now-stageJob.last>70){stageJob.last=now;rasterize(petG.innerHTML,"30 70 340 120",$("#pxStage"),stageJob);}
  const pct=((mover.x-30)/340*100).toFixed(2)+"%";
  $("#petHit").style.left=pct;$(".zzz").style.left="calc("+pct+" + 6%)";petPct=(mover.x-30)/340*100;
    chip.textContent=p.name;
  if(lastG!==null&&lastG<1&&G>=1&&!S.override){S.hatchAt=now;burst(14);cheep();}
  lastG=G;
  if(focus&&st==="running") statusEl.textContent=worm.phase==="gulp"?`${p.name} found a worm!`:runningMsg(G,p);
  const ms=st==="idle"?S.mins[S.mode]*60000:S.remaining*speed();
  const sec=Math.ceil(ms/1000),str=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  if(str!==lastTimeStr){
    timeEl.innerHTML=str.split("").map(c=>`<span class="d${c===":"?" c":""}">${c}</span>`).join("");lastTimeStr=str;
    document.title=(st==="running"||st==="paused")?`${str} · ${focus?"Focus":"Break"} | Pomofarm`:"Pomofarm";
  }
  updateFarm(dt);
  RAF(curLoop);
}
setInterval(()=>{if(S.status==="running"&&Date.now()>=S.endAt){S.remaining=0;complete();}},1000);

/* pixel rasterizer: draw the SVG small, then snap every pixel to the two-color palette */
const isPixel=()=>S.style==="pixel";
const isDark=()=>document.documentElement.classList.contains("pf-dark");
const sceneEl=document.querySelector(".scene");
const DEFS_L=[...sceneEl.querySelectorAll("clipPath,filter")].map(e=>e.outerHTML).join("");
const DEFS_D=DEFS_L.replace('<filter id="outline"','<filter id="outline"').replace(/(<filter id="outline"[^]*?flood-color=")#23221F/,"$1#ECEAE4");
const PAL_L=["#23221F","#FAFAF9","#D4D4D2","#EAEAE8","#D9D9D7","#BDBDBB","#4A4944"].map(hex);
const PAL_D=PAL_L.concat([hex("#ECEAE4")]);
function blockReduce(big,w,h,SS,dark,halo){
  const bw=w*SS,bh=h*SS,src=big.getImageData(0,0,bw,bh).data,pal=dark?PAL_D:PAL_L;
  const out=new ImageData(w,h),d=out.data,n=SS*SS;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let op=0,ink=0,r=0,g=0,b=0,m=0;
    for(let j=0;j<SS;j++)for(let i=0;i<SS;i++){
      const o=((y*SS+j)*bw+x*SS+i)*4,a=src[o+3];
      if(a<120)continue;
      op++;
      const pr=src[o]*255/a,pg=src[o+1]*255/a,pb=src[o+2]*255/a,lum=(pr+pg+pb)/3;
      const inkLike=lum<95;
      if(inkLike)ink++;else{r+=pr;g+=pg;b+=pb;m++;}
    }
    const o=(y*w+x)*4;
    if(op<n*.38)continue;
    let c;
    if(ink>=n*.2||m===0)c=pal[0];
    else{
      r/=m;g/=m;b/=m;let best=1,bd=1e9;
      for(let k=1;k<pal.length;k++){const q=pal[k],dd=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(dd<bd){bd=dd;best=k;}}
      c=pal[best];
    }
    d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255;
  }
  if(halo){
    const hl=hex("#ECEAE4"),mark=[];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      if(d[(y*w+x)*4+3])continue;
      const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].some(([a,b])=>a>=0&&b>=0&&a<w&&b<h&&d[(b*w+a)*4+3]);
      if(nb)mark.push((y*w+x)*4);
    }
    mark.forEach(o=>{d[o]=hl[0];d[o+1]=hl[1];d[o+2]=hl[2];d[o+3]=255;});
  }
  return out;
}
function rasterize(content,vb,canvas,job){
  if(job&&job.busy) return;
  if(job) job.busy=true;
  const dark=isDark(),SS=4;
  let body=content;
  const w=canvas.width,h=canvas.height;
  const src=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w*SS}" height="${h*SS}"><defs>${DEFS_L}</defs>${body}</svg>`;
  const img=new Image();
  img.onload=()=>{
    try{
      const big=document.createElement("canvas");big.width=w*SS;big.height=h*SS;
      const bc=big.getContext("2d",{willReadFrequently:true});bc.drawImage(img,0,0,w*SS,h*SS);
      canvas.getContext("2d").putImageData(blockReduce(bc,w,h,SS,dark,dark&&!canvas.closest(".farm")),0,0);
    }catch(e){}
    if(job)job.busy=false;
  };
  img.onerror=()=>{if(job)job.busy=false;};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
}
function pixelateStatic(root){
  if(!isPixel()) return;
  root.querySelectorAll("svg").forEach(svg=>{
    const vb=svg.getAttribute("viewBox");if(!vb)return;
    const [, , vw,vh]=vb.split(/[ ,]+/).map(Number);
    const r=svg.getBoundingClientRect();const cw=r.width||40,ch=r.height||40;
    const cols=Math.max(6,Math.round(vw/4));
    const c=document.createElement("canvas");c.className="pxs";c.width=cols;c.height=Math.max(6,Math.round(cols*vh/vw));
    c.style.width=cw+"px";c.style.height=ch+"px";c.setAttribute("aria-hidden","true");
    svg.replaceWith(c);
    rasterize(svg.innerHTML,vb,c);
  });
}
const stageJob={busy:false,last:0};
/* theme */
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function syncPip(){if(pipWin&&!pipWin.closed)pipWin.document.documentElement.className=document.documentElement.className;}
function applyTheme(){
  let dark;
  if(S.theme==="dark")dark=true;
  else if(S.theme==="light")dark=false;
  else{const h=document.documentElement.getAttribute("data-theme");dark=h?h==="dark":!!(mq&&mq.matches);}
  document.documentElement.classList.toggle("pf-dark",dark);
  document.documentElement.classList.toggle("pf-pixel",S.style==="pixel");
  if(typeof artReady!=="undefined"&&artReady){buildSpecies();pixelateStatic($("#speciesRow"));}
  syncPip();
  document.querySelectorAll("[data-style-pick]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.stylePick===S.style)));
  document.querySelectorAll("[data-theme-pick]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themePick===S.theme)));
}
document.querySelectorAll("[data-style-pick]").forEach(b=>b.addEventListener("click",()=>{S.style=b.dataset.stylePick;save();applyTheme();}));
document.querySelectorAll("[data-theme-pick]").forEach(b=>b.addEventListener("click",()=>{S.theme=b.dataset.themePick;save();applyTheme();}));
if(mq&&mq.addEventListener)mq.addEventListener("change",applyTheme);
try{new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
applyTheme();
(function(){
  const btn=$("#btnMini");
  if(!("documentPictureInPicture" in window)) return;
  btn.hidden=false;
  let moved=[];
  function restore(){
    moved.forEach(([el,ph])=>ph.replaceWith(el));moved=[];
    pipWin=null;startLoop(window);btn.textContent="Mini window";
  }
  btn.addEventListener("click",async()=>{
    if(pipWin){pipWin.close();return;}
    let w;
    try{w=await window.documentPictureInPicture.requestWindow({width:360,height:310});}
    catch(e){statusEl.textContent="Mini window isn't available here. Try opening the page in its own tab.";return;}
    pipWin=w;
    document.querySelectorAll('style,link[rel="stylesheet"]').forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
    syncPip();
    const wrap=w.document.createElement("div");wrap.className="app mini";
    [$("#stage"),$(".who"),$("#time"),$(".actions")].forEach((el,i)=>{
      const ph=i===0?Object.assign(document.createElement("div"),{className:"mini-note",textContent:"Playing in the mini window"}):document.createComment("mini");
      el.replaceWith(ph);moved.push([el,ph]);wrap.appendChild(el);
    });
    w.document.body.style.margin="0";w.document.body.appendChild(wrap);
    w.addEventListener("pagehide",restore);
    btn.textContent="Close mini window";
    startLoop(w);
  });
})();
window.__FP={drawPet,drawEgg,drawHatch,SPECIES,VARIANTS};
nameEl.value=S.pet.name;
buildSpecies();buildDurs();renderSide();reset();
var artReady=true;pixelateStatic($("#speciesRow"));
startLoop(window);
})();
