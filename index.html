<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomofarm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAFAF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomofarm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one quiet centered column (pet, ring, timer, one button); farm and settings live in bottom sheets */
  --bg:#FAFAF9;
  --surface:#FAFAF9;
  --ink:#23221F;
  --muted:#8A8A88;
  --line:#E3E3E1;
  --accent:#23221F;
  --soft:#F0F0EE;
  --soft2:#EDEDEB;
  --veil:rgba(250,250,249,.75);
  --font-display:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* no grey/blue tap box on phones; keyboard focus ring stays */
html{-webkit-tap-highlight-color:rgba(0,0,0,0)}
button,.fpet,.pet-hit,.stage,#farm,svg{-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-touch-callout:none;touch-action:manipulation}
.stage,.stage *,#farm,#farm *,.species,.icon,.btn{-webkit-user-select:none;user-select:none}
.fpet:focus:not(:focus-visible),.pet-hit:focus:not(:focus-visible),button:focus:not(:focus-visible){outline:none}
.fpet,.pet-hit{outline:none}
.fpet:focus-visible,.pet-hit:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}

.app{min-height:100%;max-width:420px;margin:0 auto;padding:18px 20px 32px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.icon:hover{background:var(--soft)}
.icon svg{width:22px;height:22px}
.badge{position:absolute;right:4px;top:4px;min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
.tabs{display:flex;gap:2px;background:var(--soft2);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.stage{position:relative;width:calc(100% + 40px);margin:56px -20px 0;aspect-ratio:340/120}
.stage svg.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pet-hit{position:absolute;left:50%;width:26%;top:18%;bottom:0;transform:translateX(-50%);border:0;background:transparent;border-radius:40%}
.float{position:absolute;pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.float svg{width:14px;height:14px;display:block}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-60px) scale(1.1);opacity:0}}
.zzz{position:absolute;left:56%;top:22%;font-weight:700;color:var(--muted);pointer-events:none;display:none}
.stage.sleep .zzz{display:block}
.zzz span{position:absolute;animation:zz 2.6s ease-out infinite;opacity:0}
.zzz span:nth-child(2){animation-delay:.9s;font-size:19px}
.zzz span:nth-child(3){animation-delay:1.8s;font-size:23px}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(28px,-46px);opacity:0}}
.spark{position:absolute;left:50%;top:58%;width:5px;height:5px;border-radius:50%;background:var(--ink);pointer-events:none;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

.who{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.who b{font-size:18px;font-weight:600}
.who small{color:var(--muted);font-size:13.5px}
.meta{display:flex;align-items:center;gap:12px}
.hearts{display:flex;gap:3px}
.hearts svg{width:13px;height:13px;display:block}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.time{font-weight:500;font-size:72px;line-height:1;margin-top:22px;display:flex}
.time .d{display:inline-block;width:.58em;text-align:center}
.time .c{width:.32em;transform:translateY(-.06em)}
.taskline{font-size:14px;color:var(--muted);min-height:20px;text-align:center}
.status{color:var(--muted);font-size:14.5px;text-align:center;min-height:42px;max-width:30ch;text-wrap:balance}
.actions{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;width:100%}
.btn{border:0;border-radius:999px;padding:15px 0;width:min(240px,100%);font-weight:600;font-size:17px;background:var(--ink);color:var(--bg);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.text-btn{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px}
/* phone in landscape: pet on the left, timer and buttons on the right */
@media (orientation:landscape) and (max-height:540px),(min-width:900px) and (min-height:541px){
  .app:not(.mini){max-width:none;height:100%;min-height:0;padding:8px max(24px,env(safe-area-inset-right)) 8px max(24px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto repeat(5,auto);align-content:center;column-gap:28px;row-gap:2px;justify-items:center}
  .app:not(.mini) .bar{grid-column:1 / -1;grid-row:1}
  .app:not(.mini) .stage{grid-column:1;grid-row:2 / span 5;align-self:center;width:100%;margin:0;transform:scale(1.4);transform-origin:50% 62%}
  .app:not(.mini) .who{grid-column:2;grid-row:2;margin-top:0}
  .app:not(.mini) .time{grid-column:2;grid-row:3;font-size:62px;margin-top:4px}
  .app:not(.mini) .taskline{grid-column:2;grid-row:4;min-height:16px}
  .app:not(.mini) .status{grid-column:2;grid-row:5;min-height:36px}
  .app:not(.mini) .actions{grid-column:2;grid-row:6;margin-top:4px}
  .app:not(.mini) .btn{padding:12px 0}
}
@media (orientation:landscape) and (max-height:540px){
  .sheet{max-height:94%;width:min(640px,100%)}
  .farm{flex:none;height:210px}
}
/* desktop: roomier two-column layout */
@media (min-width:900px) and (min-height:541px){
  .app:not(.mini){max-width:1040px;margin:0 auto;padding:28px 32px;column-gap:64px;row-gap:4px}
  .app:not(.mini) .time{font-size:96px;margin-top:10px}
  .app:not(.mini) .who b{font-size:22px}
  .app:not(.mini) .status{font-size:16px;min-height:44px;max-width:34ch}
  .app:not(.mini) .actions{margin-top:12px}
  .app:not(.mini) .btn{width:min(280px,100%);padding:16px 0}
  .app:not(.mini) .stage{transform:scale(1.75);transform-origin:50% 62%;grid-row:1 / span 6}
  .app:not(.mini) .bar{grid-column:2;grid-row:1;width:100%;max-width:280px;margin-bottom:22px}
  .app:not(.mini) .who{margin-top:4px}
  .sheet{width:min(560px,100%)}
}

.app.mini{padding:6px 12px 12px;max-width:none;min-height:100vh;justify-content:center;gap:2px}
.app.mini .stage{margin-top:0}
.app.mini .time{font-size:52px;margin-top:8px}
.app.mini .who{margin-top:0}
.mini-note{margin:60px auto;color:var(--muted);font-size:14px;text-align:center}
.text-btn.warn{color:var(--ink);text-decoration:underline}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);max-height:86%;overflow-y:auto;background:var(--surface);border:1.5px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px 28px;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:9;display:flex;flex-direction:column;gap:16px}
.sheet.on{transform:translate(-50%,0)}
.sheet{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;gap:14px}
.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head .text-btn[data-close]{background:var(--ink);color:var(--bg);padding:8px 18px;font-size:14px;font-weight:600;line-height:1;transition:transform .1s}
.sheet-head .text-btn[data-close]:active{transform:scale(.96)}
.sheet h2{font-size:21px;font-weight:600;margin:0}
.group{display:flex;flex-direction:column;gap:8px}
.gl{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.species{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:transparent;border-radius:16px;padding:8px 6px 7px;font-size:13.5px;font-weight:600}
.species svg,.species canvas{width:46px;height:46px;flex:none}
#speciesRow{flex-wrap:nowrap}
.species[aria-pressed="true"]{border-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:0}
.dur{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dur[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.field{width:100%;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;font-size:15px}
.field:disabled{color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.switch input{width:18px;height:18px;accent-color:var(--ink)}
.farm{position:relative;height:250px;border-radius:18px;overflow:hidden;border:1.5px solid var(--ink);background:linear-gradient(180deg,transparent 0 44%,var(--ink) 44% calc(44% + 1.5px),var(--soft) calc(44% + 1.5px) 100%)}
.farm .barn{position:absolute;left:4%;bottom:calc(56% - 2px);width:130px}
.farm .tree{position:absolute;right:7%;bottom:calc(56% - 2px);width:46px}
.farm .rails{position:absolute;left:40%;right:2%;bottom:calc(56% + 5px);height:9px;display:flex;flex-direction:column;justify-content:space-between}
.farm .rails i{display:block;height:1.8px;background:var(--ink);border-radius:1px}
.farm .posts{position:absolute;left:41%;right:2%;bottom:56%;height:22px;display:flex;justify-content:space-between}
.farm .posts i{width:3px;height:22px;border-radius:2px;background:var(--ink);display:block}
.fpet{position:absolute;width:58px;height:58px;transform:translateX(-50%);border:0;background:transparent;padding:0}
.fpet svg{width:100%;height:100%;display:block;overflow:visible}
.fpet,.fpet .sv{overflow:visible}
.farm{cursor:pointer}
.farm .trough{position:absolute;left:72%;bottom:12%;width:64px;transform:translateX(-50%);z-index:28;pointer-events:none}
.grain{position:absolute;width:5px;height:3.5px;border-radius:50%;background:#23221F;pointer-events:none;animation:gdrop .35s ease-out both}
@keyframes gdrop{from{transform:translate(-50%,-34px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.farm-hint{margin:8px 2px 0;font-size:12.5px;color:var(--muted);text-align:center}
.fpet .sv{display:block;width:100%;height:100%}
@keyframes waddle{from{translate:0 0;rotate:-4deg}to{translate:0 -2px;rotate:4deg}}
@keyframes hop{50%{margin-bottom:14px}}
.farm-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80%;text-align:center;color:var(--muted);font-size:14px}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.roster span{font-size:13px;background:var(--soft);border-radius:999px;padding:4px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.insight{font-size:14px;color:var(--muted);margin:0}
.insight b{color:var(--ink)}

/* overlay */
.overlay{position:fixed;inset:0;background:var(--veil);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;overflow:hidden}
.overlay.on{display:flex}
.dialog{background:var(--surface);border:1.5px solid var(--ink);border-radius:24px;padding:24px 22px 18px;max-width:330px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .35s ease-out;position:relative;z-index:2}
.dialog .art svg{width:120px;height:110px;display:block}
.dialog h3{font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.dialog p{margin:0;color:var(--muted);font-size:14.5px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.reasons button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.reasons button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
.confetti{position:absolute;top:-20px;width:8px;height:10px;border-radius:50%;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}


/* dark theme: UI tokens + the two-color art swapped through its literal fill/stroke values */
:root.pf-dark{--bg:#151514;--surface:#151514;--ink:#ECEAE4;--muted:#8F8D87;--line:#34332F;--accent:#ECEAE4;--soft:#22211F;--soft2:#262523;--veil:rgba(21,21,20,.78);color-scheme:dark}
.pf-dark feFlood:not(.fixed){flood-color:#ECEAE4}
.pf-dark svg [fill="#23221E"]{fill:#ECEAE4}
.pf-dark svg [stroke="#23221E"]{stroke:#ECEAE4}
.pf-dark .farm svg [fill="#23221E"]{fill:#23221E}
.pf-dark .farm svg [stroke="#23221E"]{stroke:#23221E}
.theme-row .dur{text-transform:none}
/* farm stays in daylight in both themes */
.pf-dark .farm{background:linear-gradient(180deg,#FAFAF9 0 44%,#23221F 44% calc(44% + 1.5px),#F0F0EE calc(44% + 1.5px) 100%);border-color:var(--line)}
.pf-dark .farm .rails i,.pf-dark .farm .posts i{background:#23221F}
.pf-dark .farm .farm-empty{color:#8A8A88}
.pf-dark .farm svg [fill="#23221F"]{fill:#23221F}
.pf-dark .farm svg [fill="#FAFAF9"]{fill:#FAFAF9}
.pf-dark .farm svg [fill="#D4D4D2"]{fill:#D4D4D2}
.pf-dark .farm svg [fill="#EAEAE8"]{fill:#EAEAE8}
.pf-dark .farm svg [fill="#D9D9D7"]{fill:#D9D9D7}
.pf-dark .farm svg [fill="#BDBDBB"]{fill:#BDBDBB}
.pf-dark .farm svg [fill="#4A4944"]{fill:#4A4944}
.pf-dark .farm svg [stroke="#23221F"]{stroke:#23221F}
.pf-dark .farm svg [stroke="#FAFAF9"]{stroke:#FAFAF9}
.pf-dark .farm svg [stroke="#77766F"]{stroke:#77766F}

@media (prefers-reduced-motion:reduce){
  .spark,.confetti,.float,.zzz span}
  .sheet,.scrim{transition:none}
  .dialog{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button type="button" class="icon" id="openFarm" aria-label="My farm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 10.5L12 4l9 6.5V20H3z"/><path d="M9.5 20v-5.5h5V20"/></svg><span class="badge" id="farmBadge"></span></button>
    <div class="tabs" role="group" aria-label="Mode">
      <button type="button" data-mode="focus" aria-pressed="true">Focus</button>
      <button type="button" data-mode="short" aria-pressed="false">Break</button>
    </div>
    <button type="button" class="icon" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>

  <div class="stage" id="stage">
    <svg class="scene" viewBox="30 70 340 120" aria-hidden="true">
      <defs>
        <clipPath id="clipTop"><polygon points="60,70 140,70 140,128 131,128 124,129 118,124 112,129 106,123 100,128 95,123 89,129 84,123 78,128 69,128 60,128"/></clipPath>
        <clipPath id="clipBot"><polygon points="60,128 69,128 78,128 84,123 89,129 95,123 100,128 106,123 112,129 118,124 124,129 131,128 140,128 140,180 60,180"/></clipPath>
      </defs>
      <g id="pet"></g>
      <filter id="outline" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/><feFlood flood-color="#23221F"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="outlineFixed" x="-20%" y="-20%" width="140%" height="140%"><feMorphology in="SourceAlpha" operator="dilate" radius="1.5" result="d"/><feFlood class="fixed" flood-color="#23221F"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </svg>
    <button type="button" class="pet-hit" id="petHit" aria-label="Pet your pet"></button>
    <div class="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
  </div>

  <div class="who">
    <b id="chip">Peep</b>
    <div class="meta">
      <span class="dots" id="cycleDots" aria-label="Growth"></span>
    </div>
  </div>

  <div class="time" id="time">25:00</div>
  <div class="taskline" id="taskline"></div>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="actions">
    <button type="button" class="btn" id="btnMain">Start</button>
    <button type="button" class="text-btn" id="btnSec" hidden>Give up</button>
    <button type="button" class="text-btn" id="btnMini" hidden>Mini window</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="farmSheet" aria-labelledby="farmTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="farmTitle">My farm</h2><button type="button" class="text-btn" data-close>Done</button></div>
  <div class="farm" id="farm"><div class="rails"><i></i><i></i></div><div class="posts"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><svg class="barn" viewBox="0 0 140 98" aria-hidden="true"><g stroke="#23221F" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<path d="M108 96V40Q120 24 132 40V96Z" fill="#FAFAF9"/><path d="M108 56H132M108 72H132M108 88H132" fill="none" stroke-width="1.4" opacity=".55"/>
<path d="M10 46L55 15L100 46V96H10Z" fill="#FAFAF9"/>
<path d="M4 48L55 9L106 48" fill="none" stroke-width="6"/>
<rect x="46" y="31" width="18" height="12" rx="1.5" fill="#EAEAE8"/>
<rect x="35" y="58" width="40" height="38" fill="#EAEAE8"/><path d="M35 58L75 96M75 58L35 96M55 58V96" fill="none" stroke-width="1.6"/>
<rect x="16" y="60" width="12" height="12" fill="#EAEAE8"/><rect x="82" y="60" width="12" height="12" fill="#EAEAE8"/>

<script>
(function(){
"use strict";
const GROUND=172;
let pipWin=null;
const $=s=>document.querySelector(s)||(pipWin&&!pipWin.closed?pipWin.document.querySelector(s):null);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const f=n=>(+n).toFixed(1);
const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const LINE="#23221E";const PAPER="#FAFAF9",INK="#23221F",TINT="#D4D4D2",TINT2="#EAEAE8";
const VARIANTS={
  white:{label:"Plain",body:PAPER,wing:TINT2,tail:TINT,w:35},
  grey:{label:"Misty",body:"#D9D9D7",wing:"#BDBDBB",tail:"#BDBDBB",w:22},
  speckled:{label:"Plain",body:PAPER,wing:TINT2,tail:TINT,w:0},
  masked:{label:"Masked",body:PAPER,head:INK,wing:TINT2,tail:INK,w:12},
  black:{label:"Shadow",body:INK,wing:"#4A4944",tail:"#4A4944",dark:true,w:9}
};
function randomVariant(){const tot=Object.values(VARIANTS).reduce((a,v)=>a+v.w,0);let r=Math.random()*tot;for(const k in VARIANTS){r-=VARIANTS[k].w;if(r<=0)return k;}return "white";}
const SPECIES={
  chick:{name:"Chicken",def:"Peep",stages:["Egg","Chick","Young","Teen","Hen"],baby:PAPER,babyS:TINT,adult:PAPER,adultS:TINT,beak:INK,leg:LINE,egg:PAPER,eggSpot:TINT,confetti:["var(--ink)","var(--muted)"]},
  duck:{name:"Duck",def:"Puddle",stages:["Egg","Duckling","Young","Teen","Duck"],baby:PAPER,babyS:TINT,adult:PAPER,adultS:TINT,beak:INK,leg:LINE,egg:PAPER,eggSpot:TINT,confetti:["var(--ink)","var(--muted)"]},
  goose:{name:"Goose",def:"Honk",stages:["Egg","Gosling","Young","Teen","Goose"],baby:PAPER,babyS:TINT,adult:PAPER,adultS:TINT,beak:INK,leg:LINE,egg:PAPER,eggSpot:TINT,confetti:["var(--ink)","var(--muted)"]}
};

/* ---------- drawing (side-view characters, local 100x100 box, ground y=98) ---------- */
const PX=50,PY=74;
const WORLD=s=>`<g transform="translate(${PX} ${PY})">${s}</g>`;
const formOf=G=>G<2?0:G<3.2?1:2;
const sizeF=(k,G)=>k===0?lerp(.78,1,seg(G,1,2)):k===1?lerp(.86,1,seg(G,2,3.2)):lerp(.9,1,seg(G,3.2,4));
const sizeOf=G=>sizeF(formOf(G),G);
const ss=t=>{t=clamp(t);return t*t*(3-2*t);};
/* when the form changes, the old form fades into the new one (o.mix, driven by the frame loop) */
function formMix(G,o){return o&&o.mix?o.mix:[[formOf(G),1]];}
/* baby/teen peck: body tilts about the feet (th) while the head nods about a neck pivot (nd) - eased, no rigid fold */
const PECKS={
  chick:[{th:28,px:57,dip:2,nd:32,nx:50,ny:72,tx:74,ty:76},{th:22,px:51,dip:2,nd:60,nx:56,ny:58,tx:90,ty:45}],
  duck:[{th:28,px:57,dip:2,nd:24,nx:50,ny:72,tx:76,ty:76},{th:22,px:51,dip:2,nd:47,nx:56,ny:58,tx:94.5,ty:47}],
  goose:[{th:28,px:57,dip:0,nd:25,nx:50,ny:72,tx:79,ty:75}]
};
const peckOf=(type,k)=>PECKS[type][k];
/* adults bow with a smooth arc through the neck + body tilt (no hard fold) */
const PCD="M58 14C70 12 78 22 76 32C75 38 72 40 74 48C82 60 80 74 66 82C56 88 40 88 30 82C18 74 16 54 24 42C28 36 38 36 44 32C48 22 50 14 58 14Z";
const PGS="M60 3C70 3 74 10 74 18C74 26 72 32 72 40C72 46 77 50 79 56C84 68 78 80 66 84C56 90 40 90 30 84C18 76 16 58 24 48C28 44 36 42 42 40C48 36 48 24 50 16C51 8 54 3 60 3Z";
const PTG="M60 22C69 22 73 28 73 35C73 42 71 46 72 52C73 57 78 60 80 64C85 74 79 84 67 87C57 92 40 92 31 87C19 80 17 66 25 57C29 53 36 52 42 50C48 47 48 38 50 33C51 26 54 22 60 22Z";
const ADULT={
  chick:{path:PCD,px:52,py:62,L:38,bx:24,bw:12,tilt:48,tip:[87,29],base:0},
  duck:{path:PCD,px:52,py:62,L:38,bx:24,bw:12,tilt:48,tip:[91,31],base:4},
  goose:{path:PGS,px:61,py:56,L:32,bx:22,bw:12,tilt:42,tip:[92.5,18],base:0},
  tg:{path:PTG,px:61,py:58,L:28,bx:22,bw:12,tilt:46,tip:[90.5,35],base:0}
};
function bendPt(c,x,y,phi){
  let r=phi*Math.PI/180;if(Math.abs(r)<.002)return [x,y,0];
  const sg=r<0?-1:1;r=Math.abs(r);
  const s0=c.py-y;if(s0<=0)return [x,y,0];
  const wx=ss((x-(c.px-c.bx))/c.bw);if(wx<=0)return [x,y,0];
  const L=c.L,k=r/L,B=Math.min(1,r/1.5);
  const sc=Math.min(s0,L),lam=1-.35*B*Math.sin(Math.PI*clamp(s0/L)),u=sg*(x-c.px)*lam,th=k*sc,rho=Math.max(2,1/k-u);
  let X=1/k-rho*Math.cos(th),Y=rho*Math.sin(th);
  if(s0>L){const e=s0-L;X+=e*Math.sin(r);Y+=e*Math.cos(r);}
  return [lerp(x,c.px+sg*X,wx),lerp(y,c.py-Y,wx),phi];
}
function featPt(c,x,y,phi){
  const r=phi*Math.PI/180,a=bendPt(c,c.px,c.py-c.L,phi),dx=x-c.px,dy=y-(c.py-c.L),co=Math.cos(r),si=Math.sin(r);
  return [a[0]+dx*co-dy*si,a[1]+dx*si+dy*co];
}
function bendPath(c,d,phi){return d.replace(/(-?\d*\.?\d+)[ ,](-?\d*\.?\d+)/g,(m,a,b)=>{const p=bendPt(c,+a,+b,phi);return f(p[0])+" "+f(p[1]);});}
function rotPt(x,y,t){const a=t*Math.PI/180,co=Math.cos(a),si=Math.sin(a);return [56+(x-56)*co-(y-86)*si,86+(x-56)*si+(y-86)*co];}
function tipAt(c,phi,tilt,dip){const b=featPt(c,c.tip[0],c.tip[1],phi),r=rotPt(b[0],b[1],tilt);return [r[0],r[1]+c.base+dip];}
Object.keys(ADULT).forEach(k=>{const c=ADULT[k];let p,ph;for(ph=0;ph<=170;ph+=.5){p=tipAt(c,ph,c.tilt,6);if(p[1]>=96.5)break;}c.phiM=ph;c.tipX=p[0];c.tipY=p[1];});
function adultPose(type,pk){const c=ADULT[type];return {phi:c.phiM*pk,tilt:c.tilt*pk,dip:6*pk};}
function peckTip(type,G){
  const k=formOf(G),s=sizeOf(G);
  if(k===2||(k===1&&type==="goose")){const c=ADULT[k===2?type:"tg"];return {dx:(c.tipX-PX)*s,lift:Math.max(0,(98-c.tipY)*s)};}
  const P=peckOf(type,k),R=(x,y,cx,cy,t)=>{const r=t*Math.PI/180,co=Math.cos(r),si=Math.sin(r);return [cx+(x-cx)*co-(y-cy)*si,cy+(x-cx)*si+(y-cy)*co];};
  let q=R(P.tx,P.ty,P.nx,P.ny,P.nd);q=R(q[0],q[1],P.px,98,P.th);
  return {dx:(q[0]-PX)*s,lift:Math.max(0,(98-q[1]-P.dip)*s)};
}
function eggShape(){return "M50 30C66 30 76 52 74 68C72 84 62 92 50 92C38 92 28 84 26 68C24 52 34 30 50 30Z";}
function eggFill(type){return type==="duck"?TINT2:PAPER;}
const eggScale=(type,c)=>type==="goose"?`<g transform="translate(50 98) scale(1.12) translate(-50 -98)">${c}</g>`:c;
function nestBowl(){
  return `<path d="M20 88Q50 110 80 88Q50 96 20 88Z" fill="${TINT}" stroke="${LINE}" stroke-width="3" stroke-linejoin="round"/><path d="M30 94l-4 -4M44 98l-1 -6M58 98l2 -6M70 94l4 -4" stroke="${LINE}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
}
function drawEgg(type,p,o){
  const t=o.t||0;
  const period=Math.max(1.2,3.4-2*p),ph=t%period,env=ph<.7?Math.sin(ph/.7*Math.PI):0;
  const amp=(o.running?(3+9*p):1.2)*env+(o.tapWob||0);
  const rot=Math.sin(t*22)*amp;
  const cr=[["M31 60l7 6l6 -8l7 8l7 -7l8 7l6 -5",seg(p,.3,.6)],["M46 66l-2 8l4 5",seg(p,.55,.82)],["M60 62l3 -9l-4 -6",seg(p,.78,.98)]];
  let c="";
  cr.forEach(([d,k])=>{if(k>0)c+=`<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1-k).toFixed(3)}" stroke="${LINE}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;});
  const body=`<g transform="rotate(${f(rot)} 50 92)"><path d="${eggShape()}" fill="${eggFill(type)}" stroke="${LINE}" stroke-width="3.2" stroke-linejoin="round"/><path d="M36 50q3 -9 12 -12" fill="none" stroke="${type==="duck"?PAPER:TINT}" stroke-width="3" stroke-linecap="round"/>${c}</g>`;
  return `<ellipse cx="100" cy="${GROUND+3}" rx="${type==="goose"?44:40}" ry="5" fill="${LINE}" opacity=".1"/>`+WORLD(eggScale(type,body)+nestBowl());
}
let uidN=0;
function petParts(type,form,o,G){
  const duck=type==="duck",goose=type==="goose",web=duck||goose,V=VARIANTS[o.variant]||VARIANTS.white,uid="c"+(uidN++%5000);
  const darkFace=!!(V.dark||V.head),faceInk=darkFace?PAPER:INK,col=V.body;
  const tailFill=(V.head||V.dark)?V.tail:col,wingFill=V.dark?"#4A4944":(V.wing||col);
  const combFill=V.dark?"#4A4944":TINT,beakFill=darkFace?TINT:INK,beakLine=darkFace?TINT:LINE;
  const t=o.t||0,ph=t*9,walk=!!o.walk;
  const bobAmp=form===0?1.3:form===1?1.4:1.6;
  const b=(walk?Math.abs(Math.sin(ph))*bobAmp:Math.sin(t*2.2)*(o.sleep?.9:.4)+.4);
  const sw='stroke-linecap="round" stroke-linejoin="round"';
  const S=`stroke="${LINE}"`;
  const bl=o.blink||0;
  // legs
  const xs=form===0?[43,57]:form===1?(goose?[40,54]:[37,51]):(goose?[46,58]:[47,59]);
  const k=form===0?1:form===1?.8:1.15;
  const top=form===0?(72-b+17):form===1?(goose?89-b:84-b+(duck?2:0)):(goose?86-b:80-b+(duck?8:0));
  const dyA=(duck?4:0)-b,ltop=goose?86:80+(duck?4:0);
  let legs="";
  [[xs[0],0],[xs[1],Math.PI]].forEach(([x0,off])=>{
    const q=ph+off,lift=walk?Math.max(0,Math.sin(q))*5*k:0,x=x0-(walk?Math.cos(q)*5*k:0),gy=98-lift;
    let tx=x0,ty=top;
    if(form===2||(form===1&&goose)){const r=rotPt(x0,form===2?ltop:top+b,o.tilt||0);tx=r[0];ty=r[1]+dyA+(o.dip||0);}
    legs+=`<path d="M${f(tx)} ${f(ty)}L${f(x)} ${f(gy)}" ${S} stroke-width="3" fill="none" ${sw}/>`;
    if(web)legs+=`<ellipse cx="${f(x+3)}" cy="${f(gy-.5)}" rx="${form===0?6:goose&&form===2?8:7}" ry="2.2" fill="${TINT}" ${S} stroke-width="2.2"/>`;
    else legs+=`<path d="M${f(x-4)} ${f(gy)}L${f(x+6)} ${f(gy)}" ${S} stroke-width="2.6" fill="none" ${sw}/>`;
  });
  const fan=(bx,by,angs,len,rx,ry)=>{let s="";const wob=Math.sin(ph*.5)*(walk?3:.8);angs.forEach((a,i)=>{const aa=a+wob*(i%2?1:-1),r=aa*Math.PI/180,cx=bx+Math.cos(r)*len,cy=by+Math.sin(r)*len;s+=`<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${rx}" ry="${ry}" transform="rotate(${f(aa)} ${f(cx)} ${f(cy)})" fill="${tailFill}" ${S} stroke-width="3"/>`;});return s;};
  const wingPath=(x,y,s)=>`M${x+10*s} ${y}C${x+14*s} ${y+5*s} ${x+8*s} ${y+12*s} ${x} ${y+13*s}q${-2.5*s} ${3*s} ${-6*s} ${.8*s}q${-2.5*s} ${3*s} ${-6*s} 0C${x-12*s} ${y+5*s} ${x-2*s} ${y} ${x+10*s} ${y}Z`;
  const burst=walk&&((t*.31)%1>.78)?Math.abs(Math.sin(t*20)):0;
  const wsw=walk?6+6*Math.sin(ph*2)+34*burst:0;
  const fl=(o.flap||0)*-28+wsw;
  const wing=(x,y,s,sw2)=>`<g transform="rotate(${f(fl)} ${f(x+8*s)} ${f(y)})"><path d="${wingPath(x,y,s)}" fill="${wingFill}" ${S} stroke-width="${sw2}" ${sw}/></g>`;
  const eye=(ex,ey,r)=>{
    if(o.sleep||o.happy)return `<path d="M${f(ex-r)} ${f(ey)}q${f(r)} ${o.happy?f(-r*1.4):f(r*1.2)} ${f(2*r)} 0" fill="none" ${S.replace(LINE,faceInk)} stroke-width="2" ${sw}/>`;
    let s="";
    if(darkFace&&bl<.5)s+=`<circle cx="${f(ex)}" cy="${f(ey)}" r="${f(r*1.75)}" fill="${PAPER}"/>`;
    s+=`<ellipse cx="${f(ex)}" cy="${f(ey)}" rx="${r}" ry="${f(Math.max(.3,r*(1-bl*.92)))}" fill="${INK}"/>`;
    if(bl<.4&&!darkFace)s+=`<circle cx="${f(ex+1.1)}" cy="${f(ey-1.1)}" r="1" fill="${PAPER}"/>`;
    if(o.sad>0){s+=`<path d="M${f(ex-r*1.5)} ${f(ey-r*2.1)}L${f(ex+r*1.2)} ${f(ey-r*3.1)}" stroke="${faceInk}" stroke-width="1.7" stroke-linecap="round" opacity="${o.sad.toFixed(2)}"/><path d="M${f(ex+1)} ${f(ey+r*1.4)}q${f(-r*.9)} ${f(r*1.8)} 0 ${f(r*2.4)}q${f(r*.9)} ${f(-r*.6)} 0 ${f(-r*2.4)}z" fill="${PAPER}" stroke="${INK}" stroke-width="1.1" opacity="${o.sad.toFixed(2)}"/>`;}
    return s;
  };
  const cheek=(x,y)=>`<ellipse cx="${f(x)}" cy="${f(y)}" rx="3.6" ry="2.3" fill="${V.dark?"#4A4944":TINT}"/>`;
  let body="";
  const maskClip=(d,m)=>V.head?`<clipPath id="${uid}"><path d="${d}"/></clipPath><g clip-path="url(#${uid})"><path d="${m}" fill="${V.head}"/></g>`:"";
  if(form===0){
    const cy=72-b,cap=(duck||goose)?TINT2:PAPER,R=goose?20:19;
    body+=fan(goose?30:32,cy,(duck||goose)?[-150]:[-160,-130],5,5.5,3);
    body+=`<circle cx="50" cy="${f(cy)}" r="${R}" fill="${col}" ${S} stroke-width="3.2"/>`;
    const nodT=`<g transform="rotate(${f(o.nod||0)} 50 ${f(cy)})">`;
    if(V.head)body+=`${nodT}<path d="M${50-R} ${f(cy-2)}A${R} ${R} 0 0 1 ${50+R} ${f(cy-2)}Z" fill="${V.head}"/></g>`;
    body+=wing(48,cy+1,.8,2.2);
    body+=nodT+(goose?cheek(62,cy+6):cheek(61,cy+5))+eye(59,cy-1,3.2);
    body+=goose?`<ellipse cx="71" cy="${f(cy+3)}" rx="8" ry="3.8" fill="${TINT}" ${S} stroke-width="2.2"/>`:duck?`<ellipse cx="69" cy="${f(cy+4)}" rx="7" ry="3.6" fill="${TINT}" ${S} stroke-width="2.2"/>`:`<path d="M65 ${f(cy)}L74 ${f(cy+4)}L65 ${f(cy+8)}Z" fill="${beakFill}" stroke="${beakLine}" stroke-width="2" ${sw}/>`;
    if(!o.noCap){const ck=goose?31:30;body+=`<path d="M33 ${f(cy-6)}L39 ${f(cy-14)}L45 ${f(cy-8)}L51 ${f(cy-16)}L57 ${f(cy-8)}L63 ${f(cy-14)}L67 ${f(cy-6)}C66 ${f(cy-ck)} 34 ${f(cy-ck)} 33 ${f(cy-6)}Z" fill="${cap}" ${S} stroke-width="3.2" ${sw}/>`;}
    body+=`</g>`;
  }else if(form===1&&goose){
    const c=ADULT.tg,phi=o.phi||0,tilt=o.tilt||0,dip=o.dip||0;
    const F=(x,y)=>featPt(c,x,y,phi);
    body+=`<g transform="translate(0 ${f(dip-b)}) rotate(${f(tilt)} 56 86)">`;
    body+=fan(26,66,[-160,-130],8,7.5,4);
    const BP=bendPath(c,PTG,phi);
    body+=`<path d="${BP}" fill="${col}" ${S} stroke-width="3.2" ${sw}/>`;
    body+=maskClip(BP,bendPath(c,"M40 10L90 10L90 52Q66 60 40 48Z",phi));
    body+=wing(48,62,.9,2.4);
    const ck=F(69,38),ey=F(65,31),bq=F(81,35);
    body+=cheek(ck[0],ck[1])+eye(ey[0],ey[1],2.9);
    body+=`<ellipse cx="${f(bq[0])}" cy="${f(bq[1])}" rx="9.5" ry="4.4" transform="rotate(${f(phi)} ${f(bq[0])} ${f(bq[1])})" fill="${TINT}" ${S} stroke-width="2.3"/>`;
    body+=`</g>`;
  }else if(form===1){
    const bb=b,nT=`<g transform="rotate(${f(o.nod||0)} 56 ${f(58-bb)})">`;

/* ---------- audio ---------- */
let ac=null;
function ensureAudio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}if(ac&&ac.state==="suspended")ac.resume();if(ac)loadSamples();}catch(e){ac=null;}}
function tone(fr,at,len,vol,type,slide,bp){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";
  o.frequency.setValueAtTime(fr,at);if(slide)o.frequency.exponentialRampToValueAtTime(slide,at+len);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.01);g.gain.exponentialRampToValueAtTime(.0001,at+len);
  let out=o;
  if(bp){const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=bp;f.Q.value=2.2;o.connect(f);out=f;}
  out.connect(g).connect(ac.destination);o.start(at);o.stop(at+len+.05);
}
function chime(){if(!ac)return;try{const n=ac.currentTime;[659.3,880,1046.5].forEach((fr,i)=>tone(fr,n+i*.18,1.3,.16));}catch(e){}}
let noiseBuf=null,noiseCtx=null;
function noiseBurst(t,len,vol,fr,q){
  if(!noiseBuf||noiseCtx!==ac){noiseCtx=ac;noiseBuf=ac.createBuffer(1,Math.floor(ac.sampleRate*.3),ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=fr;bp.Q.value=q||1;
  const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+len);
  s.connect(bp);bp.connect(g);g.connect(ac.destination);s.start(t);s.stop(t+len+.02);
}
/* one animal "syllable": pitch contour + vocal-tract formants + roughness (AM) + vibrato */
function vox(o){
  const t=o.t,L=o.len,osc=ac.createOscillator(),g=ac.createGain();
  osc.type=o.type||"sawtooth";
  osc.frequency.setValueAtTime(o.f[0],t);
  osc.frequency.linearRampToValueAtTime(o.f[1],t+L*.35);
  osc.frequency.linearRampToValueAtTime(o.f[2],t+L);
  const atk=o.atk||.012,sus=o.sus||0;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol,t+atk);
  if(sus)g.gain.setValueAtTime(o.vol,t+L*sus);
  g.gain.exponentialRampToValueAtTime(.0001,t+L);
  let src=osc;
  if(o.form){
    const mix=ac.createGain();mix.gain.value=o.boost||3;
    o.form.forEach(([fr,q,gn])=>{const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=fr;bp.Q.value=q;const fg=ac.createGain();fg.gain.value=gn;osc.connect(bp);bp.connect(fg);fg.connect(mix);});
    src=mix;
  }
  if(o.am){
    const D=o.amD||.4,lfo=ac.createOscillator(),ld=ac.createGain(),am=ac.createGain();
    lfo.frequency.value=o.am;ld.gain.value=D;am.gain.value=1-D*.5;lfo.connect(ld);ld.connect(am.gain);
    src.connect(am);src=am;lfo.start(t);lfo.stop(t+L+.05);
  }
  if(o.vib){
    const lfo=ac.createOscillator(),ld=ac.createGain();lfo.frequency.value=o.vib[0];ld.gain.value=o.vib[1];
    lfo.connect(ld);ld.connect(osc.detune);lfo.start(t);lfo.stop(t+L+.05);
  }
  src.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+L+.05);
}
/* optional real recordings: put chick.mp3 / duck.mp3 / goose.mp3 (or .ogg/.wav) in /sounds; otherwise the synth below is used */
const samples={};
function loadSamples(){
  if(!ac||loadSamples.done)return;loadSamples.done=true;
  if(!/^https?:$/.test(location.protocol))return;
  ["chick","duck","goose"].forEach(async t=>{
    for(const ext of ["mp3","ogg","wav","m4a"]){
      try{const r=await fetch(`sounds/${t}.${ext}`);if(!r.ok)continue;samples[t]=await ac.decodeAudioData(await r.arrayBuffer());return;}catch(e){}
    }
  });
}
function playSample(buf,G,mult,type){
  const n=ac.currentTime+.01,gr=clamp(((G||1)-1)/3),src=ac.createBufferSource(),g=ac.createGain();
  src.buffer=buf;
  const rate=lerp(type==="goose"?1.5:1.7,.9,Math.pow(gr,.8))*(.96+Math.random()*.08);
  src.playbackRate.value=rate;
  const dur=Math.min(buf.duration/rate,lerp(.6,1.4,gr)),vol=lerp(.35,.9,gr)*(mult||1);
  g.gain.setValueAtTime(vol,n);g.gain.setValueAtTime(vol,n+Math.max(0,dur-.15));g.gain.linearRampToValueAtTime(0,n+dur);

      if(gr<.4){

      }else{
        const f0=lerp(560,290,(gr-.4)/.6)*j;
        const form=[[lerp(750,620,gr),7,1],[lerp(1350,1050,gr),6,1.1],[2300,5,.45]];
        vox({t:n,len:.34,vol,f:[f0*.88,f0*1.16,f0*.92],form,am:lerp(95,60,gr),amD:.45,vib:[6,22],boost:3.2,atk:.03,sus:.55});
        vox({t:n+.38,len:.27,vol:vol*.85,f:[f0*.82,f0*1.08,f0*.8],form,am:lerp(95,60,gr),amD:.45,vib:[6,22],boost:3.2,atk:.03,sus:.5});

    }else if(type==="duck"){

      }else{

      }else{
        const f0=lerp(780,440,(gr-.5)/.5)*j,form=[[lerp(900,650,gr),6,1],[lerp(2000,1600,gr),5,.9],[3000,5,.35]];

}

/* ---------- actions ---------- */
function setMode(m){S.mode=m;if(m==="focus")S.override=null;buildDurs();reset();}
function reset(){S.status="idle";S.remaining=durMs();S.duration=durMs();hideOverlay();updateUI();}
function start(){if(S.mode==="focus")S.override=null;worm.phase="none";worm.next=clock+5+Math.random()*7;S.duration=durMs();S.remaining=S.duration;S.endAt=Date.now()+S.duration;S.status="running";updateUI();}
function pause(){S.remaining=Math.max(0,S.endAt-Date.now());S.status="paused";updateUI();}
function resume(){S.endAt=Date.now()+S.remaining;S.status="running";updateUI();}
let confirmTimer=null;
function giveUp(){
  if(!btnSec.classList.contains("warn")){
    btnSec.classList.add("warn");btnSec.textContent=curG()<1?"Sure? The egg will go cold":`Sure? ${S.pet.name} will leave`;
    clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{btnSec.classList.remove("warn");updateUI();},3000);
    return;
  }
  clearTimeout(confirmTimer);btnSec.classList.remove("warn");
  const gNow=curG();
  S.status="failed";S.sadUntil=0;
  const gone=Object.assign({},S.pet);
  S.lost++;S.pet=newPet(gone.type);nameEl.value=S.pet.name;
  save();updateUI();showReflect(gone,gNow);
}
function complete(){
  if(S.status!=="running") return;
  S.status="done";S.remaining=0;chime();
  if(S.mode==="focus"){
    const p=S.pet;
    p.sessions++;p.hearts=Math.min(3,p.hearts+1);
    S.log.push({at:Date.now(),mins:S.mins.focus,task:taskEl.value.trim(),type:p.type});
    if(S.log.length>600)S.log=S.log.slice(-600);
    let kind="grew";
    if(4*(p.sessions-1)/S.rounds<1&&4*p.sessions/S.rounds>=1)kind="hatched";
    if(p.sessions>=S.rounds){
      kind="adult";
      S.farm.push({type:p.type,name:p.name,variant:p.variant,at:Date.now()});
      S.override={type:p.type,name:p.name,variant:p.variant};
      S.pet=newPet(p.type);
      S.nextBreak="long";

  if(!(S.hatchAt&&hatchK<1)&&G>=1){
    let wormPeck=0,wormHold=false,wormHappy=false;
    const canHunt=focus&&st==="running"&&!reduced&&!S.override;
    if(!canHunt&&worm.phase!=="gulp")worm.phase="none";
    if(canHunt&&worm.phase==="none"&&clock>worm.next){worm.phase="approach";worm.x=360;worm.t=clock;}
    const pt=peckTip(p.type,G),reach=200+pt.dx+2;
    if(worm.phase==="approach"){
      worm.x-=dt*30;
      if(worm.x<=reach){worm.x=reach;worm.phase="peck";worm.t=clock;}
      wormSvg=drawWorm(worm.x,clock,clamp((clock-worm.t)/.6));
    }else if(worm.phase==="peck"){
      const k=(clock-worm.t)/.55;wormHold=true;
      if(k>=1){worm.phase="gulp";worm.t=clock;cheep();floatAt(HEART(true),petPct+4,30,2);countWorm();}
      else{wormPeck=Math.sin(k*Math.PI);if(k<.5)wormSvg=`<g transform="translate(0 ${f(-pt.lift*easeOut(Math.min(1,k*2.4)))})">${drawWorm(worm.x,clock,1)}</g>`;}
    }else if(worm.phase==="gulp"){
      wormHold=true;wormHappy=true;
      if(clock-worm.t>1.4){worm.phase="none";worm.next=clock+12+Math.random()*20;}
    }
    const walking=moveStep(dt,G,sleeping||sad>0.05||peck>0||hop>0||wormHold,breakMode);
    const fm=formOf(G);
    if(lastForm!==null&&fm!==lastForm)formFade={from:lastForm,t0:now};
    lastForm=fm;
    let mix=null;
    if(formFade){const a=ss((now-formFade.t0)/1400);if(a>=1)formFade=null;else mix=[[formFade.from,1-a],[fm,a]];}
    svg=drawPet(p.type,G,{variant:p.variant,t:clock,blink,peck:Math.max(peck,wormPeck),hop,flap,sleep:sleeping,sad,seeds:false,happy:hop>4||wormHappy,walk:walking,mix,rest});
  }
  const mx=mover.x-100;
  const dir=G<1||(S.hatchAt&&hatchK<1)?1:mover.dir;
  petG.innerHTML=(breakMode&&G>=1&&!sleeping?seedsWorld():"")+`<g transform="translate(${f(mx+100)} 0) scale(${dir} 1) translate(-100 0)">${svg}</g>`+wormSvg;
  const pct=((mover.x-30)/340*100).toFixed(2)+"%";
  $("#petHit").style.left=pct;$(".zzz").style.left="calc("+pct+" + 6%)";petPct=(mover.x-30)/340*100;
    chip.textContent=p.name;
  if(lastG!==null&&lastG<1&&G>=1&&!S.override){S.hatchAt=now;burst(14);cheep();}
  lastG=G;
  if(focus&&st==="running") statusEl.textContent=worm.phase==="gulp"?`${p.name} found a worm!`:runningMsg(G,p);
  const ms=st==="idle"?S.mins[S.mode]*60000:S.remaining*speed();
  const sec=Math.ceil(ms/1000),str=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  if(str!==lastTimeStr){
    timeEl.innerHTML=str.split("").map(c=>`<span class="d${c===":"?" c":""}">${c}</span>`).join("");lastTimeStr=str;
    document.title=(st==="running"||st==="paused")?`${str} · ${focus?"Focus":"Break"} | Pomofarm`:"Pomofarm";
  }
  updateFarm(dt);
  RAF(curLoop);
}
setInterval(()=>{if(S.status==="running"&&Date.now()>=S.endAt){S.remaining=0;complete();}},1000);

/* ---------- events ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{if(S.status==="running"||S.status==="paused")return;setMode(b.dataset.mode);}));
btnMain.addEventListener("click",()=>{
  ensureAudio();const st=S.status;
  if(st==="idle")start();else if(st==="running")pause();else if(st==="paused")resume();
  else if(st==="failed")reset();else setMode("focus");
});
btnSec.addEventListener("click",()=>{if(S.mode==="focus")giveUp();else setMode("focus");});
$("#petHit").addEventListener("click",()=>{
  ensureAudio();
  if(curG()<1&&!S.override){beh.tapWob=8;return;}
  if(S.status==="paused") return;
  if(napT>NAP_AFTER)napT=0;
  beh.hopT=clock;cheep();floatAt(HEART(true),petPct,30,3);
});
nameEl.addEventListener("input",()=>{S.pet.name=nameEl.value.trim()||SPECIES[S.pet.type].def;save();chip.textContent=S.pet.name;});
nameEl.addEventListener("blur",()=>{nameEl.value=S.pet.name;updateUI();});
fastEl.addEventListener("change",()=>{S.fast=fastEl.checked;if(S.status==="idle")reset();});
taskEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(S.status==="idle"){ensureAudio();start();}}});
document.addEventListener("keydown",e=>{
  if(e.code!=="Space"||e.target.tagName==="INPUT"||e.target.tagName==="BUTTON"||overlay.classList.contains("on")||scrim.classList.contains("on"))return;
  e.preventDefault();btnMain.click();
});

/* theme */
const mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function syncPip(){if(pipWin&&!pipWin.closed)pipWin.document.documentElement.className=document.documentElement.className;}
function applyTheme(){
  let dark;
  if(S.theme==="dark")dark=true;
  else if(S.theme==="light")dark=false;
  else{const h=document.documentElement.getAttribute("data-theme");dark=h?h==="dark":!!(mq&&mq.matches);}
  document.documentElement.classList.toggle("pf-dark",dark);
  if(typeof artReady!=="undefined"&&artReady)buildSpecies();
  syncPip();
  document.querySelectorAll("[data-theme-pick]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themePick===S.theme)));
}
document.querySelectorAll("[data-theme-pick]").forEach(b=>b.addEventListener("click",()=>{S.theme=b.dataset.themePick;save();applyTheme();}));
if(mq&&mq.addEventListener)mq.addEventListener("change",applyTheme);
try{new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
applyTheme();
(function(){
  const btn=$("#btnMini");
  if(!("documentPictureInPicture" in window)) return;
  btn.hidden=false;
  let moved=[];
  function restore(){
    moved.forEach(([el,ph])=>ph.replaceWith(el));moved=[];
    pipWin=null;startLoop(window);btn.textContent="Mini window";
  }
  btn.addEventListener("click",async()=>{
    if(pipWin){pipWin.close();return;}
    let w;
    try{w=await window.documentPictureInPicture.requestWindow({width:360,height:310});}
    catch(e){statusEl.textContent="Mini window isn't available here. Try opening the page in its own tab.";return;}
    pipWin=w;
    document.querySelectorAll('style,link[rel="stylesheet"]').forEach(n=>w.document.head.appendChild(n.cloneNode(true)));
    syncPip();
    const wrap=w.document.createElement("div");wrap.className="app mini";
    [$("#stage"),$(".who"),$("#time"),$(".actions")].forEach((el,i)=>{
      const ph=i===0?Object.assign(document.createElement("div"),{className:"mini-note",textContent:"Playing in the mini window"}):document.createComment("mini");
      el.replaceWith(ph);moved.push([el,ph]);wrap.appendChild(el);
    });
    w.document.body.style.margin="0";w.document.body.appendChild(wrap);
    w.addEventListener("pagehide",restore);
    btn.textContent="Close mini window";
    startLoop(w);
  });
})();
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}
window.__FP={voice,ensureAudio,drawPet,drawEgg,drawHatch,SPECIES,VARIANTS};
nameEl.value=S.pet.name;
buildSpecies();buildDurs();renderSide();reset();
var artReady=true;
startLoop(window);
})();
</script>
